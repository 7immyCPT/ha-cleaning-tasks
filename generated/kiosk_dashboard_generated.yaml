title: Cleaning - Today
views:
  - title: Today's Tasks
    path: today
    icon: mdi:broom
    cards:
      - type: markdown
        content: >
          ## {{ now().strftime('%A %d %B %Y') }}

          Tick each task off as you finish it. Tap the speaker icon to have it read aloud.
      - type: vertical-stack
        cards:
          - type: heading
            heading: "Kitchen"
            heading_style: title
          - type: conditional
            conditions:
              - entity: input_boolean.due_kitchen_counters
                state: "on"
            card:
              type: horizontal-stack
              cards:
                - type: tile
                  entity: input_boolean.done_kitchen_counters
                  name: "Wipe counters & stovetop"
                  icon: mdi:broom
                  tap_action:
                    action: toggle
                - type: tile
                  entity: input_boolean.done_kitchen_counters
                  name: " "
                  icon: mdi:volume-high
                  show_state: false
                  tap_action:
                    action: call-service
                    service: pyscript.cleaning_speak_task
                    service_data:
                      task_id: kitchen_counters
                      media_player: media_player.kiosk_tablet
