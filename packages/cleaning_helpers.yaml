# Package: cleaning helpers
# Place in /config/packages/cleaning_helpers.yaml
# Requires `homeassistant: packages: !include_dir_named packages` in configuration.yaml

input_boolean:
  cleaning_day_mon:
    name: Cleaner comes Monday
    icon: mdi:calendar-check
  cleaning_day_tue:
    name: Cleaner comes Tuesday
    icon: mdi:calendar-check
    initial: true
  cleaning_day_wed:
    name: Cleaner comes Wednesday
    icon: mdi:calendar-check
  cleaning_day_thu:
    name: Cleaner comes Thursday
    icon: mdi:calendar-check
  cleaning_day_fri:
    name: Cleaner comes Friday
    icon: mdi:calendar-check
    initial: true
  cleaning_day_sat:
    name: Cleaner comes Saturday
    icon: mdi:calendar-check
  cleaning_day_sun:
    name: Cleaner comes Sunday
    icon: mdi:calendar-check

input_select:
  cleaning_media_player:
    name: Speaker for reading tasks aloud
    options:
      - media_player.kiosk_tablet
    initial: media_player.kiosk_tablet
    icon: mdi:volume-high

automation:
  - alias: Cleaning - daily refresh at 06:00
    trigger:
      - platform: time
        at: "06:00:00"
    action:
      - service: pyscript.cleaning_daily_refresh

  - alias: Cleaning - refresh checklist when cleaning days change
    mode: queued
    max: 10
    trigger:
      - platform: state
        entity_id:
          - input_boolean.cleaning_day_mon
          - input_boolean.cleaning_day_tue
          - input_boolean.cleaning_day_wed
          - input_boolean.cleaning_day_thu
          - input_boolean.cleaning_day_fri
          - input_boolean.cleaning_day_sat
          - input_boolean.cleaning_day_sun
    action:
      - service: pyscript.cleaning_refresh_today
